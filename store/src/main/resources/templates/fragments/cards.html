<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<article class="card h-100 shadow-sm" th:fragment="product-card(p)">
    <div class="product-photo card-img-top"><span>Photo coming soon</span></div>
    <div class="card-body">
        <h2 class="h5 card-title">
            <a th:href="@{/products/{slug}(slug=${p.slug})}" th:text="${p.name}">Name</a>
        </h2>
        <p class="text-muted small mb-1" th:text="${p.categoryName}">Category</p>
        <p class="text-muted small mb-2" th:if="${p.gsm != null}">
            <span th:text="${p.gsm}">180</span> GSM &middot; <span th:text="${p.fabric}">Fabric</span>
        </p>
        <p class="fw-bold mb-0" th:if="${p.fromPrice != null}">
            From &#8377;<span th:text="${#numbers.formatDecimal(p.fromPrice, 1, 'COMMA', 2, 'POINT')}">399.00</span>
        </p>
    </div>
</article>
</body>
</html>
