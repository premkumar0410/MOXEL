<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>All T-Shirts | Moxel</title>
</head>
<body>
<main>
    <h1 class="h2 mb-3">Our T-Shirts</h1>
    <div class="row g-3">
        <div class="col-12 col-sm-6 col-lg-4" th:each="p : ${products}">
            <th:block th:replace="~{fragments/cards :: product-card(${p})}"></th:block>
        </div>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(products)}">No products available yet.</p>
</main>
</body>
</html>
