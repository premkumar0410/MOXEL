<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Create account | Moxel</title></head>
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <h1 class="h3 mb-3">Create your account</h1>
            <form th:action="@{/register}" th:object="${form}" method="post" novalidate>

                <div class="mb-3">
                    <label for="fullName" class="form-label">Full name</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                           autocomplete="name" maxlength="100">
                    <div class="invalid-feedback" th:errors="*{fullName}">Error</div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           autocomplete="email" maxlength="254">
                    <div class="invalid-feedback" th:errors="*{email}">Error</div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Mobile number (optional)</label>
                    <div class="input-group">
        <span class="input-group-text gap-2">
            <th:block th:replace="~{fragments/flag :: india-flag}"></th:block>
            <span>+91</span>
        </span>
                        <input type="tel" id="phone" th:field="*{phone}" class="form-control"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                               inputmode="numeric" maxlength="10" autocomplete="tel-national"
                               placeholder="10-digit mobile number">
                        <div class="invalid-feedback" th:errors="*{phone}">Error</div>
                    </div>
                    <div class="form-text">Enter 10 digits only. We add +91 for you.</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           autocomplete="new-password" maxlength="64">
                    <div class="form-text">At least 10 characters. A few random words work well.</div>
                    <div class="invalid-feedback" th:errors="*{password}">Error</div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Repeat password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                           autocomplete="new-password" maxlength="64">
                    <div class="invalid-feedback" th:errors="*{confirmPassword}">Error</div>
                </div>

                <button type="submit" class="btn btn-dark w-100">Create account</button>
            </form>
            <p class="mt-3 small">Already registered? <a th:href="@{/login}">Log in</a></p>
        </div>
    </div>
</main>
</body>
</html>
