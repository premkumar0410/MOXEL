<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Log in | Moxel</title></head>
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <h1 class="h3 mb-3">Log in</h1>

            <div class="alert alert-danger" th:if="${param.error}">
                Invalid email or password.
            </div>
            <div class="alert alert-success" th:if="${param.registered}">
                Account created. Please log in.
            </div>
            <div class="alert alert-info" th:if="${param.logout}">
                You have been logged out.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Email</label>
                    <input type="email" id="username" name="username" class="form-control"
                           autocomplete="username" required maxlength="254">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                           autocomplete="current-password" required maxlength="64">
                </div>
                <button type="submit" class="btn btn-dark w-100">Log in</button>
            </form>
            <p class="mt-3 small">New here? <a th:href="@{/register}">Create an account</a></p>
        </div>
    </div>
</main>
</body>
</html>
