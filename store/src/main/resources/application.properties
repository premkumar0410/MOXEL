spring.application.name=store
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never
server.server-header=


spring.datasource.url=jdbc:postgresql://localhost:5432/moxel_store
spring.datasource.username=moxel_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

shop.name=Moxel
shop.tagline=Custom prints, made in Chennai
shop.email=hello@example.com
shop.phone=+91 00000 00000
shop.address=Chennai, Tamil Nadu, India

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m